# FerrumGate Alert Rules for Prometheus
#
# This is a TEMPLATE with PLACEHOLDER thresholds.
# Adjust thresholds based on your workload and monitoring requirements.
#
# USAGE:
#   1. Copy to Prometheus rules directory (e.g., /etc/prometheus/rules/)
#   2. Update prometheus.yml to include this file in rule_files
#   3. Reload Prometheus: curl -X POST http://localhost:9090/-/reload
#
# NOTES:
#   - These are example rules based on FerrumGate metrics
#   - Adjust thresholds for your environment
#   - For production, add more specific alert conditions
#   - `runbook_url` annotations use repo-relative links to
#     `docs/operations/runbook.md#<alert-id>` so they resolve when this file is
#     viewed inside the FerrumGate repository. For standalone Prometheus
#     deployments (no repo checkout alongside the rules), replace these with an
#     absolute URL to your hosted runbook, or copy `docs/operations/runbook.md`
#     next to the rules file. `scripts/validate_monitoring_metrics.py` warns on
#     missing runbook URLs and on any leftover example-domain placeholder.
#   - Alerts whose expression maps to a panel in
#     `ferrumgate-grafana-dashboard.json` carry `dashboardUid` + `panelId`
#     annotations so Grafana can link the alert to that panel. Rules without a
#     matching panel (node_exporter instance alerts, the TEMPLATE replication
#     rule, and rules whose metrics have no panel in the current dashboard)
#     intentionally omit these annotations.

groups:
  # FerrumGate service alerts
  - name: ferrumgate
    # How frequently to evaluate rules
    interval: 30s

    rules:
      # Service availability
      - alert: FerrumGateDown
        expr: up{job="ferrumgate"} == 0
        for: 1m
        labels:
          severity: critical
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate instance is down"
          description: "FerrumGate has been unreachable for more than 1 minute."
          runbook_url: "../../docs/operations/runbook.md#ferrumgate-down"
          dashboardUid: ferrumgate-overview
          panelId: 6

      # Service health
      - alert: FerrumGateStoreUnhealthy
        expr: ferrumgate_store_health_up != 1
        for: 1m
        labels:
          severity: critical
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate store is unhealthy"
          description: "FerrumGate SQLite store health check is failing. Database may be corrupted or inaccessible."
          runbook_url: "../../docs/operations/runbook.md#ferrumgate-store-unhealthy"

      # Write queue depth
      - alert: FerrumGateWriteQueueHigh
        expr: ferrumgate_write_queue_depth > 100
        for: 5m
        labels:
          severity: warning
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate write queue is high"
          description: "Write queue depth is {{ $value }}, expected < 100. System may be experiencing write contention."
          runbook_url: "../../docs/operations/runbook.md#ferrumgate-queue-high"

      # Write queue full (blocked)
      - alert: FerrumGateWriteQueueFull
        expr: ferrumgate_write_queue_depth > 1000
        for: 2m
        labels:
          severity: critical
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate write queue is full"
          description: "Write queue depth is {{ $value }}. System is blocking writes. Immediate action required."
          runbook_url: "../../docs/operations/runbook.md#ferrumgate-queue-full"

      # High error rate (5xx responses)
      - alert: FerrumGateHighErrorRate
        expr: |
          rate(ferrumgate_http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate high error rate"
          description: "Error rate is {{ $value | printf \"%.3f\" }} errors/sec (threshold: 0.05)."
          runbook_url: "../../docs/operations/runbook.md#ferrumgate-high-error-rate"
          dashboardUid: ferrumgate-overview
          panelId: 2

      # High latency
      - alert: FerrumGateHighLatency
        expr: |
          histogram_quantile(0.99,
            sum(rate(ferrumgate_request_duration_seconds[5m])) by (le, route)
          ) > 5
        for: 5m
        labels:
          severity: warning
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate high latency"
          description: "99th percentile latency is {{ $value | printf \"%.2f\" }}s for route {{ $labels.route }}."
          runbook_url: "../../docs/operations/runbook.md#ferrumgate-high-latency"
          dashboardUid: ferrumgate-overview
          panelId: 3

      # Capability minting failures
      - alert: FerrumGateCapabilityMintFailures
        expr: |
          rate(ferrumgate_governance_errors_total{
            route="/v1/capabilities/mint",
            method="POST"
          }[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate capability minting failures"
          description: "Capability minting failure rate is {{ $value | printf \"%.3f\" }} failures/sec."
          runbook_url: "../../docs/operations/runbook.md#ferrumgate-cap-mint-failures"
          dashboardUid: ferrumgate-overview
          panelId: 10

      # Policy evaluation failures
      - alert: FerrumGatePolicyEvalFailures
        expr: |
          rate(ferrumgate_governance_errors_total{
            route="/v1/proposals/{proposal_id}/evaluate",
            method="POST"
          }[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate policy evaluation failures"
          description: "Policy evaluation failure rate is {{ $value | printf \"%.3f\" }} failures/sec."
          runbook_url: "../../docs/operations/runbook.md#ferrumgate-policy-eval-failures"
          dashboardUid: ferrumgate-overview
          panelId: 11

      # Execution failures
      - alert: FerrumGateExecutionFailures
        expr: |
          sum(rate(ferrumgate_governance_errors_total{
            route=~"/v1/executions/.*",
            method="POST"
          }[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate execution failures"
          description: "Execution failure rate is {{ $value | printf \"%.3f\" }} failures/sec."
          runbook_url: "../../docs/operations/runbook.md#ferrumgate-execution-failures"
          dashboardUid: ferrumgate-overview
          panelId: 12

      # Rollback failures
      - alert: FerrumGateRollbackFailures
        expr: |
          rate(ferrumgate_governance_errors_total{
            route="/v1/executions/{execution_id}/compensate",
            method="POST"
          }[5m]) > 0.01
        for: 5m
        labels:
          severity: critical
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate rollback failures"
          description: "Rollback failure rate is {{ $value | printf \"%.4f\" }} failures/sec. Compensations may not complete."
          runbook_url: "../../docs/operations/runbook.md#ferrumgate-rollback-failures"
          dashboardUid: ferrumgate-overview
          panelId: 12

      # Provenance chain gaps
      - alert: FerrumGateProvenanceGaps
        expr: |
          ferrumgate_lifecycle_outbox_operator_review > 0
        for: 5m
        labels:
          severity: warning
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate provenance chain gaps detected"
          description: "{{ $value }} lifecycle records require operator review because automatic provenance reconciliation could not complete."
          runbook_url: "../../docs/operations/runbook.md#ferrumgate-provenance-gaps"
          dashboardUid: ferrumgate-overview
          panelId: 14

  # SLO / error-budget recording rules and burn-rate alerts.
  #
  # REFERENCE TARGET, NOT A COMMITTED SLO: 99.9% non-5xx availability over a
  # 30d window (error budget = 0.001, i.e. 0.1% of requests). FerrumGate has no
  # committed SLO target yet (see docs/design/viz-improvements-phased-proposal.md
  # P1-3); 99.9% is the strict end of the reference availability range in
  # docs/guides/slo-sla.md (99.0%-99.9%). Operators must confirm the target as a
  # product decision before treating budget consumption as authoritative. To
  # retarget, update 0.001 in the recording rules below; alert thresholds are
  # expressed as budget multipliers (14.4x, 6x, <20% remaining) and do not
  # change with the target.
  #
  # Burn-rate thresholds follow the multi-window multi-burn-rate pattern from
  # the Google SRE Workbook ("Alerting on SLOs"), with a 720h (30d) budget
  # window:
  #   14.4x burn (1h + 5m windows)  -> ~2% of budget consumed per 1h  (page)
  #   6x burn    (6h + 30m windows) -> ~5% of budget consumed per 6h  (ticket)
  # The paired long+short windows suppress alerts from brief spikes.
  #
  # 429 responses are excluded deliberately: docs/guides/slo-sla.md tracks the
  # rate-limit budget separately (429 reference < 1%-5%), and throttling is
  # rate limiting working as intended, not an availability failure.
  #
  # The 30d budget window needs >= 30d of scrape retention; with less history
  # it covers only the retained data and underestimates consumption.
  - name: ferrumgate_slo
    interval: 30s

    rules:
      # 5xx error ratio over trailing windows. `or vector(0)` keeps the ratio
      # defined as exactly 0 when no 5xx series exists in the window; with no
      # traffic at all the ratio is empty and alerts stay quiet.
      - record: ferrumgate:http_5xx_error_ratio:rate5m
        expr: |
          (sum(rate(ferrumgate_http_requests_total{status=~"5.."}[5m])) or vector(0))
          / sum(rate(ferrumgate_http_requests_total[5m]))

      - record: ferrumgate:http_5xx_error_ratio:rate30m
        expr: |
          (sum(rate(ferrumgate_http_requests_total{status=~"5.."}[30m])) or vector(0))
          / sum(rate(ferrumgate_http_requests_total[30m]))

      - record: ferrumgate:http_5xx_error_ratio:rate1h
        expr: |
          (sum(rate(ferrumgate_http_requests_total{status=~"5.."}[1h])) or vector(0))
          / sum(rate(ferrumgate_http_requests_total[1h]))

      - record: ferrumgate:http_5xx_error_ratio:rate6h
        expr: |
          (sum(rate(ferrumgate_http_requests_total{status=~"5.."}[6h])) or vector(0))
          / sum(rate(ferrumgate_http_requests_total[6h]))

      # Remaining error budget for the 30d window: 1 = untouched, 0 = exhausted,
      # negative = overdrawn (observed 5xx ratio above the reference target).
      - record: ferrumgate:slo_error_budget_remaining:ratio
        expr: |
          1 - (((sum(increase(ferrumgate_http_requests_total{status=~"5.."}[30d])) or vector(0))
          / sum(increase(ferrumgate_http_requests_total[30d]))) / 0.001)

      # Fast burn: budget on track to be exhausted in days, not weeks
      # (14.4x => ~2% of the 30d budget consumed per hour).
      - alert: FerrumGateSloFastBurn
        expr: |
          ((ferrumgate:http_5xx_error_ratio:rate5m / 0.001) > 14.4)
          and
          ((ferrumgate:http_5xx_error_ratio:rate1h / 0.001) > 14.4)
        for: 2m
        labels:
          severity: critical
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate SLO fast burn (14.4x reference budget)"
          description: "5xx error ratio is burning the reference 99.9% error budget at {{ $value | printf \"%.1f\" }}x on the 5m and 1h windows (threshold 14.4x, ~2% of the 30d budget per hour). Reference target from docs/guides/slo-sla.md, not a committed SLO."
          runbook_url: "../../docs/operations/runbook.md#ferrumgate-slo-fast-burn"
          dashboardUid: ferrumgate-overview
          panelId: 18

      # Slow burn: sustained budget erosion worth investigating
      # (6x => ~5% of the 30d budget consumed per 6h).
      - alert: FerrumGateSloSlowBurn
        expr: |
          ((ferrumgate:http_5xx_error_ratio:rate30m / 0.001) > 6)
          and
          ((ferrumgate:http_5xx_error_ratio:rate6h / 0.001) > 6)
        for: 15m
        labels:
          severity: warning
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate SLO slow burn (6x reference budget)"
          description: "5xx error ratio is burning the reference 99.9% error budget at {{ $value | printf \"%.1f\" }}x on the 30m and 6h windows (threshold 6x, ~5% of the 30d budget per 6h). Reference target from docs/guides/slo-sla.md, not a committed SLO."
          runbook_url: "../../docs/operations/runbook.md#ferrumgate-slo-slow-burn"
          dashboardUid: ferrumgate-overview
          panelId: 18

      # Error budget nearly exhausted for the 30d window (< 20% remaining).
      - alert: FerrumGateSloBudgetLow
        expr: ferrumgate:slo_error_budget_remaining:ratio < 0.20
        for: 30m
        labels:
          severity: warning
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate reference error budget below 20% remaining"
          description: "Remaining 30d error budget is {{ $value | humanizePercentage }} at the reference 99.9% non-5xx target (negative means the budget is overdrawn). Reference target from docs/guides/slo-sla.md, not a committed SLO."
          runbook_url: "../../docs/operations/runbook.md#ferrumgate-slo-budget-low"
          dashboardUid: ferrumgate-overview
          panelId: 19

  # Instance-level alerts
  - name: ferrumgate_instance
    interval: 30s

    rules:
      # High CPU usage
      - alert: FerrumGateHighCPU
        expr: |
          100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) by (instance))
          > 80
        for: 10m
        labels:
          severity: warning
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate instance high CPU usage"
          description: "CPU usage is {{ $value | printf \"%.1f\" }}% on instance {{ $labels.instance }}."
          runbook_url: "../../docs/operations/runbook.md#ferrumgate-high-cpu"

      # High memory usage
      - alert: FerrumGateHighMemory
        expr: |
          100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
          > 85
        for: 10m
        labels:
          severity: warning
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate instance high memory usage"
          description: "Memory usage is {{ $value | printf \"%.1f\" }}% on instance {{ $labels.instance }}."
          runbook_url: "../../docs/operations/runbook.md#ferrumgate-high-memory"

      # Disk space low
      - alert: FerrumGateDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/var/lib/ferrumgate"} /
           node_filesystem_size_bytes{mountpoint="/var/lib/ferrumgate"})
          < 0.1
        for: 5m
        labels:
          severity: critical
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate instance low disk space"
          description: "Disk space available is {{ $value | humanizePercentage }} on instance {{ $labels.instance }}."
          runbook_url: "../../docs/operations/runbook.md#ferrumgate-disk-space-low"

  # PostgreSQL-specific alerts
  # NOTE: These alerts use metrics emitted only when ferrumd is configured with
  # a PostgreSQL DSN. If running SQLite, these metrics are absent and these rules
  # should NOT be enabled (or will fire as intended if metrics should be present).
  - name: ferrumgate_postgres
    interval: 30s

    rules:
      # PostgreSQL connection down or backend not emitting PG metrics.
      # TEMPLATE: Enable only when ferrumd is configured with postgres:// DSN.
      # If you run postgres_exporter separately, prefer:
      #   up{job="postgres"} == 0
      - alert: FerrumGatePostgresMetricsAbsent
        expr: absent(ferrumgate_store_pg_pool_max) == 1
        for: 2m
        labels:
          severity: critical
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate PostgreSQL metrics are absent"
          description: "ferrumd is not emitting PostgreSQL pool metrics. Either the store backend is not PostgreSQL, or the PG connection is lost and the service has stopped reporting."
          runbook_url: "../../docs/operations/runbook.md#ferrumgate-pg-down"
          dashboardUid: ferrumgate-overview
          panelId: 8

      # Pool saturation — all connections in use.
      - alert: FerrumGatePostgresPoolSaturation
        expr: |
          (
            ferrumgate_store_pg_pool_idle == 0
            and ferrumgate_store_pg_pool_size >= ferrumgate_store_pg_pool_max
            and ferrumgate_store_pg_pool_max > 0
          )
        for: 1m
        labels:
          severity: warning
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate PostgreSQL connection pool is saturated"
          description: "PG pool has 0 idle connections out of max. New requests may block or timeout."
          runbook_url: "../../docs/operations/runbook.md#ferrumgate-pg-pool-saturation"
          dashboardUid: ferrumgate-overview
          panelId: 8

      # Slow acquire — connection acquisition timeouts.
      - alert: FerrumGatePostgresSlowAcquire
        expr: |
          rate(ferrumgate_store_pg_acquire_timeouts_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate PostgreSQL connection acquire timeouts"
          description: "PG pool acquire timeout rate is {{ $value | printf \"%.3f\" }} timeouts/sec. Pool may be undersized or PG may be slow/unreachable."
          runbook_url: "../../docs/operations/runbook.md#ferrumgate-pg-slow-acquire"
          dashboardUid: ferrumgate-overview
          panelId: 5

      # Replication lag — PLACEHOLDER / DEFERRED.
      # Requires postgres_exporter or equivalent for pg_stat_replication metrics.
      # Enable only when HA/replication is deployed (PG-5).
      - alert: FerrumGatePostgresReplicationLag
        expr: |
          pg_stat_replication_pg_wal_lsn_diff / 1024 / 1024 / 1024 > 1
        for: 5m
        labels:
          severity: warning
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate PostgreSQL replication lag high (TEMPLATE)"
          description: "Replication lag is {{ $value | printf \"%.2f\" }} GB. Threshold and metric are TEMPLATE — requires postgres_exporter or equivalent. HA/replication not deployed."
          runbook_url: "../../docs/operations/runbook.md#ferrumgate-pg-replication-lag"

  # WORM-compatible audit bundle sink alerts.
  # NOTE: These alerts use metrics emitted only when the WORM sink feature is
  # enabled (`worm-sink` feature + operator-provisioned S3 Object Lock config
  # with `live: true`). When the sink is disabled, the metrics are absent and
  # these rules will not fire. They reflect best-effort archival export, not a
  # compliance or immutability guarantee. See ADR 009.
  - name: ferrumgate_worm_sink
    interval: 30s

    rules:
      # WORM sink export failures in the last 5 minutes.
      - alert: FerrumGateWormSinkFailures
        expr: |
          rate(ferrumgate_audit_worm_sink_failures_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate WORM sink export failures detected"
          description: "WORM sink export failure rate is {{ $value | printf \"%.3f\" }} failures/sec on instance {{ $labels.instance }}. The audit bundle is still durable locally; the WORM archive replica is best-effort. This does not prove compliance immutability."
          runbook_url: "../../docs/operations/runbook.md#worm-sink-failure"
          dashboardUid: ferrumgate-overview
          panelId: 15

      # WORM sink last-success timestamp stale.
      # NOTE: The 900s threshold assumes the default 300s export interval
      # (3 consecutive missed intervals). Tune `> 900` if the operator uses a
      # longer `audit_bundle_worm_interval_secs` value.
      - alert: FerrumGateWormSinkStale
        expr: |
          time() - ferrumgate_audit_worm_sink_last_success_timestamp_seconds > 900
        for: 5m
        labels:
          severity: warning
          service: ferrumgate
          team: platform
        annotations:
          summary: "FerrumGate WORM sink last successful export is stale"
          description: "WORM sink last successful export is {{ $value | printf \"%.0f\" }} seconds old on instance {{ $labels.instance }} (threshold 900s, assumes default 300s interval). The audit bundle is still durable locally; the WORM archive replica is best-effort. This does not prove compliance immutability."
          runbook_url: "../../docs/operations/runbook.md#worm-sink-failure"
          dashboardUid: ferrumgate-overview
          panelId: 16
