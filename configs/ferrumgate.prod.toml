# FerrumGate production configuration
# Use with: ferrumd --config configs/ferrumgate.prod.toml
# Or set environment variable: FERRUMD_CONFIG=configs/ferrumgate.prod.toml

[server]
# Bind address for the HTTP server
# Use 0.0.0.0 to bind to all interfaces (requires auth_mode = "bearer")
bind_addr = "0.0.0.0:8080"

# Store data source name (DSN)
# NOTE: PostgreSQL local Docker/runtime support is implemented; production/HA/multi-node is NOT.
# MySQL is NOT implemented. See ADR-50.
# IMPORTANT: Use a persistent database in production
# Examples:
#   sqlite:///var/lib/ferrumgate/ferrumgate.db
#   postgres://user:pass@localhost:5432/db - PostgreSQL (local Docker/runtime only)
store_dsn = "sqlite:///var/lib/ferrumgate/ferrumgate.db"

# Filesystem adapter sandbox root. Required for production-like non-loopback deployments.
# The daemon creates this directory at startup if it does not exist.
fs_workdir = "/var/lib/ferrumgate/workdir"

# Git and SQLite mutation adapters are disabled unless these allowlists are non-empty.
git_repo_roots = ["/var/lib/ferrumgate/repos"]
sqlite_db_roots = ["/var/lib/ferrumgate/databases"]

# Authentication mode: "disabled", "bearer", "scoped", or "oidc"
# WARNING: Never use "disabled" in production with a non-loopback bind address
auth_mode = "bearer"

# Bearer token for authentication (required when auth_mode is "bearer")
# IMPORTANT: Use a strong, randomly generated token in production
# Generate with: openssl rand -hex 32
bearer_token = "CHANGE_ME_TO_A_SECURE_TOKEN"

# Allow binding to non-loopback addresses when auth is disabled.
# DANGEROUS: Never enable in production.
allow_insecure_nonlocal_bind = false

# Log filter (info, debug, warn, error)
log_filter = "info"

# PostgreSQL connection pool tuning (conservative defaults)
# Only used when store_dsn starts with postgres:// or postgresql://
pg_max_connections = 10
pg_min_idle = 2
pg_acquire_timeout_secs = 5

# Lifecycle outbox reconciliation (required in production)
lifecycle_reconciliation_enabled = true
# lifecycle_reconciliation_interval_secs = 60
# lifecycle_reconciliation_batch_limit = 100

# Approval timeout reconciliation (required in production)
approval_timeout_enabled = true
# approval_timeout_seconds = 3600
# approval_reconciliation_interval_secs = 300

# Audit fail-closed mode (required in production)
audit_fail_closed = true

# HA reconciler for stale in-flight executions (opt-in; default false)
# ha_reconciler_enabled = false
# ha_reconciler_interval_secs = 60
# ha_reconciler_stale_threshold_secs = 1800
# ha_reconciler_batch_size = 100

# Nonce cache backend: "auto" (default), "memory", or "postgres".
# Auto selects Postgres when store_dsn is PostgreSQL, otherwise memory.
# Use "postgres" for shared replay protection across multiple gateway processes.
# nonce_cache_backend = "auto"
# nonce_cache_ttl_secs = 0
# nonce_cache_max_entries = 10000

# ── MFA Configuration (optional) ──
# mfa_secret_key should be set via FERRUMD_MFA_SECRET_KEY environment variable
# in production to avoid committing secrets to version control.
# Must be exactly 64 hex characters (32 bytes). Generate with: openssl rand -hex 32
# approval_mfa_required = false
# mfa_totp_issuer = "FerrumGate"
# mfa_lockout_max_attempts = 5
# mfa_lockout_duration_secs = 900
# Lockout settings above apply to both per-factor and per-agent MFA lockout.

# ── WORM-Compatible Audit Bundle Sink (optional) ──
# Requires ferrumd to be built with --features worm-sink (implies s3).
# Disabled by default. The operator must provision the bucket and enable
# S3 Object Lock; the adapter does not create buckets or manage IAM.
#
# audit_worm_sink_enabled = false
# [server.audit_worm_sink]
# bucket = "my-ferrumgate-audit-bucket"
# prefix = "audit-worm"
# object_lock_mode = "governance"
# retention_days = 30
# legal_hold = false
# export_interval_secs = 300
# batch_limit = 1000
# live = false
# endpoint_url = "http://localhost:9000"
# region = "us-east-1"
# # Credentials should be provided via environment variables:
# # FERRUMD_AUDIT_WORM_SINK_ACCESS_KEY_ID
# # FERRUMD_AUDIT_WORM_SINK_SECRET_ACCESS_KEY

# ── GCS Adapter (optional) ──
# Requires ferrumd to be built with --features gcs.
# Disabled by default. Live SDK integration is a declared seam; shape-only
# validation runs when live=false. Azure Blob is deferred.
#
# [server.gcs_config]
# allowed_bucket = "my-ferrumgate-gcs-bucket"
# max_object_size = 104857600
# live = false
# endpoint_url = "https://storage.googleapis.com"
# project_id = "my-gcp-project"
# # Credentials should be provided via environment variable:
# # FERRUMD_GCS_CREDENTIALS_PATH

# ── OIDC Configuration (Phase 4.4) ──
# Uncomment and configure when auth_mode = "oidc".
# Static keys take precedence over fetched JWKS keys.
# At least one of static_keys or jwks_url must be configured.
#
# [oidc]
# issuer = "https://your-issuer.example.com"
# audiences = ["ferrumgate"]
# jwks_url = "https://your-issuer.example.com/.well-known/jwks.json"
# jwks_cache_ttl_secs = 300
# actor_id_claim = "sub"
# role_source_claim = "groups"
# require_email_verified = true
# allowed_algorithms = ["RS256", "ES256", "EdDSA"]
#
# [oidc.role_mappings]
# fg-admins = "admin"
# fg-operators = "operator"
