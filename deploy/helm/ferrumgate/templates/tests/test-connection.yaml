apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ferrumgate.fullname" . }}-test-connection"
  labels:
    {{- include "ferrumgate.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      # NOTE: this hits the SHALLOW readiness endpoint, which always returns 200
      # and does not verify store/queue health. Deep readiness (/v1/readyz/deep)
      # requires a bearer token when auth is enabled and cannot be used by this
      # unauthenticated Helm test hook.
      args: ['-O-', '{{ include "ferrumgate.fullname" . }}:{{ .Values.service.port }}/v1/readyz']
  restartPolicy: Never
