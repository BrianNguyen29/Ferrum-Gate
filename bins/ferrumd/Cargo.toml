[package]
publish = false
name = "ferrumd"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# PostgreSQL runtime support — feature-gated and local/bounded, NOT production-ready/HA
postgres = ["ferrum-store/postgres", "ferrum-gateway/postgres"]
# S3 adapter support — feature-gated to reduce default dependency footprint
s3 = ["ferrum-gateway/s3", "ferrum-adapter-s3/s3-client"]
# GCS adapter support — feature-gated to reduce default dependency footprint.
# Live SDK integration is a planned follow-up; this slice ships shape-only behavior.
gcs = ["ferrum-gateway/gcs", "ferrum-adapter-gcs/gcs-client"]
# WORM-compatible audit bundle sink (implies S3 adapter support).
worm-sink = ["s3", "ferrum-gateway/worm-sink", "ferrum-adapter-s3/worm-sink"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
ipnet.workspace = true
jsonwebtoken.workspace = true
serde.workspace = true
serde_derive.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ferrum-gateway = { path = "../../crates/ferrum-gateway" }
ferrum-proto = { path = "../../crates/ferrum-proto" }
ferrum-pdp = { path = "../../crates/ferrum-pdp" }
ferrum-cap = { path = "../../crates/ferrum-cap" }
ferrum-rollback = { path = "../../crates/ferrum-rollback" }
ferrum-store = { path = "../../crates/ferrum-store" }
ferrum-sync = { path = "../../crates/ferrum-sync" }
ferrum-adapter-fs = { path = "../../crates/ferrum-adapter-fs" }
ferrum-adapter-git = { path = "../../crates/ferrum-adapter-git" }
ferrum-adapter-http = { path = "../../crates/ferrum-adapter-http" }
ferrum-adapter-sqlite = { path = "../../crates/ferrum-adapter-sqlite" }
ferrum-adapter-maildraft = { path = "../../crates/ferrum-adapter-maildraft" }
ferrum-adapter-s3 = { path = "../../crates/ferrum-adapter-s3" }
ferrum-adapter-gcs = { path = "../../crates/ferrum-adapter-gcs", optional = true }
