name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Hardcoded secrets scan
        run: bash scripts/run_secret_scan.sh
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Install cargo security audit tools
        run: |
          cargo install --locked cargo-deny
          cargo install --locked cargo-audit
      - name: Dependency security audit
        run: bash scripts/run_security_audit.sh

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Show repository tree
        run: find . -maxdepth 3 | sort
      - name: Local validation
        run: make validate
      - name: Route scope documentation contract
        run: python3 scripts/validate_route_scope_docs.py
      - name: Documentation TOML snippets contract
        run: python3 scripts/validate_docs_toml_snippets.py
      - name: Monitoring metric contract
        run: python3 scripts/validate_monitoring_metrics.py
      - name: Prometheus rule validation
        run: >-
          docker run --rm
          --entrypoint /bin/promtool
          --volume "$PWD/configs/monitoring:/rules:ro"
          prom/prometheus:v2.53.5@sha256:7a34573f0b9c952286b33d537f233cd5b708e12263733aa646e50c33f598f16c
          check rules /rules/ferrumgate-alerts.yaml
      - name: Prometheus scrape config syntax
        run: >-
          docker run --rm
          --entrypoint /bin/promtool
          --volume "$PWD/configs/monitoring:/configs:ro"
          prom/prometheus:v2.53.5@sha256:7a34573f0b9c952286b33d537f233cd5b708e12263733aa646e50c33f598f16c
          check config /configs/prometheus-scrape-config.yaml
      - name: Alertmanager config syntax
        run: >-
          docker run --rm
          --entrypoint /bin/amtool
          --volume "$PWD/configs/monitoring:/configs:ro"
          prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
          check-config /configs/alertmanager-config.yaml
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Helm chart lint and render
        run: |
          helm lint deploy/helm/ferrumgate \
            --set secrets.bearerToken=ci-placeholder-token-not-for-production
          helm template ferrumgate deploy/helm/ferrumgate \
            --set secrets.bearerToken=ci-placeholder-token-not-for-production >/tmp/ferrumgate-rendered.yaml
      - name: Warn on shallow default readiness (advisory)
        continue-on-error: true
        run: |
          # Advisory only — does not fail CI. The chart intentionally defaults the
          # readinessProbe to the shallow /v1/readyz (always 200) because standard
          # Kubernetes probes cannot present a bearer token required by /v1/readyz/deep.
          if grep -qE 'path:[[:space:]]*/v1/readyz([[:space:]]|$)' /tmp/ferrumgate-rendered.yaml; then
            echo "::warning::Helm readinessProbe defaults to shallow /v1/readyz (always 200); it does NOT gate store/queue health. Override to /v1/readyz/deep where auth constraints allow."
          fi
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Cargo fmt check
        run: cargo fmt --all -- --check
      - name: Cargo check
        run: cargo check --workspace
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --workspace
      - name: MCP stdio smoke (advisory)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "Building ferrumd and ferrum-mcp-server (debug) for MCP smoke..."
          cargo build --bin ferrumd --bin ferrum-mcp-server
          echo "Running MCP lifecycle smoke (D1.7 + D1.11)..."
          FERRUMD="$PWD/target/debug/ferrumd" \
            FERRUM_MCP="$PWD/target/debug/ferrum-mcp-server" \
            bash scripts/run_mcp_lifecycle_smoke.sh
      - name: Adapter smoke (S3/GCS shape-only + MCP tool contract)
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/adapter_smoke.sh
      - name: Cargo check (all features)
        run: cargo check --workspace --all-features
      - name: Cargo clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Cargo check (postgres feature)
        run: cargo check -p ferrumd -p ferrum-migrate -p ferrum-store -p ferrum-gateway --features postgres
      - name: Cargo clippy (postgres feature)
        run: cargo clippy -p ferrumd -p ferrum-migrate -p ferrum-store -p ferrum-gateway --features postgres -- -D warnings
      - name: Invariant smoke
        shell: bash
        run: |
          set -euo pipefail
          make invariant-smoke
      - name: Release profile smoke
        run: bash scripts/validate_release_feature_profile.sh
      - name: ferrum-stress machine-readable smoke
        shell: bash
        run: |
          set -euo pipefail
          cargo run -q -p ferrum-stress -- \
            --scenario health \
            --duration 1 \
            --concurrency 1 \
            --output-format json >/tmp/ferrum-stress.json
          python3 - <<'PY'
          import json

          with open("/tmp/ferrum-stress.json", encoding="utf-8") as fh:
              summary = json.load(fh)
          assert summary["scenarios"][0]["scenario"] == "health"
          assert summary["scenarios"][0]["total_requests"] > 0
          PY

          cargo run -q -p ferrum-stress -- \
            --scenario health \
            --duration 1 \
            --concurrency 1 \
            --output-format junit >/tmp/ferrum-stress.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("/tmp/ferrum-stress.xml").getroot()
          assert root.tag == "testsuite"
          assert root.attrib["name"] == "ferrum-stress"
          PY
      - name: DR smoke (WAL crash-recovery + temp SQLite restore)
        shell: bash
        run: |
          set -euo pipefail
          make dr-smoke
      - name: Advisory perf regression gate (ADR 011)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "Running advisory perf gate (dry-run, non-blocking)..."
          bash scripts/run_perf_gate.sh --dry-run --duration 5 --scenarios "health,intent-compile,sqlite-contention"

  postgres-live-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: ferrumgate_dev
          POSTGRES_PASSWORD: ferrumgate_dev_password
          POSTGRES_DB: ferrumgate_p2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ferrumgate_dev -d ferrumgate_p2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Cargo test (PostgreSQL live, no skips)
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT

          cargo test -p ferrum-store --features postgres \
            --test postgres_intents -- --nocapture 2>&1 | tee "$log_file"

          cargo test -p ferrum-store --features postgres \
            -- --ignored --nocapture 2>&1 | tee -a "$log_file"

          if grep -Eq 'Skipping postgres live test|apply_embedded_migrations failed' "$log_file"; then
            echo "PostgreSQL live tests reported a skipped or failed database setup." >&2
            exit 1
          fi

          if ! grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log_file"; then
            echo "PostgreSQL live tests did not report a non-empty, fully executed suite." >&2
            exit 1
          fi

      - name: Boot ferrumd with PostgreSQL and probe health/readiness
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="$(mktemp)"
          trap 'rm -f "$LOG_FILE"; kill "$FERRUMD_PID" 2>/dev/null || true' EXIT

          cargo build --features postgres --package ferrumd

          # Clear test lifecycle outbox records so the daemon boot does not
          # observe pre-existing NeedsOperatorReview rows from the test phase.
          PGPASSWORD=ferrumgate_dev_password psql \
            -h localhost -U ferrumgate_dev -d ferrumgate_p2_test \
            -c "DELETE FROM lifecycle_outbox;"

          FERRUMD_BIN="./target/debug/ferrumd"
          BIND_ADDR="127.0.0.1:8080"

          nohup "$FERRUMD_BIN" \
            --store-dsn "postgres://ferrumgate_dev:ferrumgate_dev_password@localhost:5432/ferrumgate_p2_test" \
            --bind-addr "$BIND_ADDR" \
            --auth-mode disabled \
            --log-filter "warn,ferrum_store=debug,sqlx=debug" \
            >"$LOG_FILE" 2>&1 &
          FERRUMD_PID=$!
          echo "[INFO] ferrumd started (PID $FERRUMD_PID) on $BIND_ADDR"

          # Poll /v1/healthz
          HEALTHY=false
          for i in {1..30}; do
            if curl -sf "http://$BIND_ADDR/v1/healthz" >/dev/null 2>&1; then
              HEALTHY=true
              break
            fi
            sleep 1
          done

          if [[ "$HEALTHY" != "true" ]]; then
            echo "[ERROR] /v1/healthz did not return 200 within 30s" >&2
            echo "[INFO] Last 30 lines of ferrumd log:"
            tail -n 30 "$LOG_FILE" || true
            exit 1
          fi
          echo "[OK] /v1/healthz returned 200"

          # Poll /v1/readyz/deep
          READY=false
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$LOG_FILE" "$RESPONSE_FILE"; kill "$FERRUMD_PID" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o "$RESPONSE_FILE" -w "%{http_code}" "http://$BIND_ADDR/v1/readyz/deep" 2>/dev/null || echo "000")
            if [[ "$HTTP_CODE" == "200" ]]; then
              READY=true
              break
            fi
            sleep 1
          done

          if [[ "$READY" != "true" ]]; then
            echo "[ERROR] /v1/readyz/deep did not return 200 within 30s" >&2
            echo "[INFO] Last /v1/readyz/deep response body (HTTP code: ${HTTP_CODE:-unknown}):"
            cat "$RESPONSE_FILE" || true
            echo
            echo "[INFO] Last 60 lines of ferrumd log (ferrum_store/sqlx scoped debug):"
            tail -n 60 "$LOG_FILE" || true
            exit 1
          fi
          echo "[OK] /v1/readyz/deep returned 200"

          # Graceful shutdown
          kill "$FERRUMD_PID" || true
          wait "$FERRUMD_PID" || true

  s3-live-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Start MinIO
        run: |
          docker run -d --name ferrum-minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-01-20T14-49-07Z@sha256:ed9be66eb5f2636c18289c34c3b725ddf57815f2777c77b5938543b78a44f144 \
            server /data --console-address ":9001"
      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "[OK] MinIO is ready"
              exit 0
            fi
            sleep 1
          done
          echo "[ERROR] MinIO did not become healthy within 30s" >&2
          docker logs ferrum-minio
          exit 1
      - name: Check AWS CLI version
        run: aws --version
      - name: Create versioned bucket
        run: |
          aws configure set aws_access_key_id minioadmin
          aws configure set aws_secret_access_key minioadmin
          aws --endpoint-url http://localhost:9000 --region us-east-1 s3 mb s3://ferrum-test-bucket
          aws --endpoint-url http://localhost:9000 --region us-east-1 s3api put-bucket-versioning \
            --bucket ferrum-test-bucket \
            --versioning-configuration Status=Enabled
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Cargo test (S3 MinIO live, ignored tests)
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ferrum-adapter-s3 --features s3-client --test minio_integration -- --ignored --nocapture
      - name: Cleanup MinIO
        if: always()
        run: docker rm -f ferrum-minio || true

  coverage-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-llvm-cov
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx
      - name: Generate coverage (LCOV)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Generate coverage (text summary)
        run: cargo llvm-cov --workspace --text --output-path coverage.txt
      - name: Print coverage summary to log
        run: cat coverage.txt
      - name: Write coverage summary to GitHub step summary
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          head -n 50 coverage.txt >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage is evidence-only in this job. No hard threshold is enforced yet." >> $GITHUB_STEP_SUMMARY
          echo "Next step: when coverage stabilizes, enable the hard threshold gate via scripts/check_coverage_threshold.py --hard." >> $GITHUB_STEP_SUMMARY
      - name: Coverage soft threshold warning
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import sys

          with open("coverage.txt", encoding="utf-8") as fh:
              content = fh.read()

          coverage = None
          total_match = re.search(r'TOTAL\s+.*?([\d.]+)%', content, re.MULTILINE)
          if total_match:
              coverage = float(total_match.group(1))
          else:
              matches = re.findall(r'([\d.]+)%', content)
              if matches:
                  coverage = float(matches[-1])

          if coverage is not None and coverage < 40.0:
              print(f"::warning::Workspace coverage {coverage:.2f}% is below the soft threshold of 40%")
              print(f"::warning::When coverage stabilizes, enable hard threshold via scripts/check_coverage_threshold.py --hard")
              sys.exit(0)
          elif coverage is not None:
              print(f"Coverage {coverage:.2f}% meets soft threshold of 40%")
          else:
              print("::warning::Could not parse coverage percentage from coverage.txt")
          PY
      - name: Critical-crate coverage threshold (advisory, non-blocking)
        continue-on-error: true
        run: |
          python3 scripts/check_coverage_threshold.py coverage.txt --config coverage-thresholds.toml
      - name: Generate SBOM (CycloneDX)
        run: cargo cyclonedx --all
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            lcov.info
            coverage.txt
          retention-days: 30
      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: target/cyclonedx/*
          retention-days: 30
