[package]
publish = false
name = "ferrum-adapter-gcs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ferrum-proto = { path = "../ferrum-proto" }
ferrum-rollback = { path = "../ferrum-rollback" }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }

[features]
default = []
# Enables the live GCS client path. Without this feature, the adapter compiles
# but performs shape-only validation and returns execution_groundwork=true.
gcs-client = []

[dev-dependencies]
tokio = { workspace = true }
